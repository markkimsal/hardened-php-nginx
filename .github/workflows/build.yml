name: push-docker-images

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['8.2', '8.3', '8.4']
        platform: ['debian13', 'alpine3.22']

    steps:
      - name: "Get datetime"
        run: |
          echo "{datetime}={$(date -u --rfc-3339=seconds)}" >> "$GITHUB_ENV"
        id: datetime
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platform: linux/amd64,linux/arm64
          push: true
          tags: docker.io/markkimsal/hardened-php-nginx:${{ matrix.version }}-${{ matrix.platform }}
          labels: |
            org.opencontainer.image.created=${{ env.datetime }}
