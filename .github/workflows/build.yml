name: push-docker-images

on:
  push:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['8.2', '8.3', '8.4']
        platform: ['debian13', 'alpine3.22']

    steps:
      - name: "Get datetime"
        run: |
          echo "{datetime}={$(date -u --rfc-3339=seconds)}" >> "$GITHUB_ENV"
        id: datetime
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build prod
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=markkimsal/hardened-php-nginx:buildcache-${{ matrix.version }}-${{ matrix.platform }}
          cache-to: type=registry,ref=markkimsal/hardened-php-nginx:buildcache-${{ matrix.version }}-${{ matrix.platform }},mode=max
          context: php-fpm/${{ matrix.version }}/${{ matrix.platform }}
          platforms: linux/amd64,linux/arm64
          target: prod-image
          pull: true
          push: true
          tags: docker.io/markkimsal/hardened-php-nginx:${{ matrix.version }}-${{ matrix.platform }}-fpm
          labels: |
            org.opencontainer.image.created=${{ env.datetime }}

      - name: Build dev
        uses: docker/build-push-action@v7
        with:
          cache-from: type=registry,ref=markkimsal/hardened-php-nginx:buildcache-${{ matrix.version }}-${{ matrix.platform }}
          cache-to: type=registry,ref=markkimsal/hardened-php-nginx:buildcache-${{ matrix.version }}-${{ matrix.platform }},mode=max
          context: php-fpm/${{ matrix.version }}/${{ matrix.platform }}
          platforms: linux/amd64,linux/arm64
          target: dev-image
          pull: true
          push: true
          build-args: |
            UID=1000
            GID=1000
          tags: docker.io/markkimsal/hardened-php-nginx:${{ matrix.version }}-${{ matrix.platform }}-dev
          labels: |
            org.opencontainer.image.created=${{ env.datetime }}
